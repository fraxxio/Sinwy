name: Sinwy CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sinwy
          POSTGRES_PASSWORD: sinwy
          POSTGRES_DB: sinwy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinwy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      POSTGRES_USER: sinwy
      POSTGRES_PASSWORD: sinwy
      POSTGRES_DB: sinwy
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      BETTER_AUTH_SECRET: ci-better-auth-secret
      BETTER_AUTH_URL: http://localhost:3001
      WEB_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      RESEND_EMAIL_DOMAIN: example.com
      POLAR_ACCESS_TOKEN: ci
      POLAR_WEBHOOK_SECRET: ci
      POLAR_PRODUCT_STARTER: ci-starter
      POLAR_PRODUCT_PROFESSIONAL: ci-professional
      POLAR_PRODUCT_ENTERPRISE: ci-enterprise

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Tests
        run: bun run test
